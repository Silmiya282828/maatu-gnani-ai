<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.85 6.25 52 52" width="64" height="64">
  <title>Maatu</title>
  <!-- An open chat bubble, a U on its side, with three dots leaving it. The
       dots turn from yellow to yellow-green on the way out: the message changing
       language as it travels. The inner edge is a circle on the same
       centre as the outer one, so the back keeps one even width; it leaves the
       circle on a straight tangent that narrows each arm to a round tip. The
       tail's point is rounded off, so nothing ends sharp. Flat colours only. -->
  <path d="M22.51 48.54L12.03 54.29Q8 56.5 8.5 51.93L10.44 34.16Z" fill="#b4594f"/>
  <path d="M44 7.2H30A22.8 22.8 0 0 0 30 52.8H44A1.6 1.6 0 0 0 44 49.6Q41 49.6 38 49.03L26.78 46.9A17.2 17.2 0 0 1 26.78 13.1L38 10.97Q41 10.4 44 10.4A1.6 1.6 0 0 0 44 7.2Z" fill="#b4594f"/>
  <rect x="24.2" y="27.2" width="5.6" height="5.6" rx="1.3" transform="rotate(45 27 30)" fill="#fbb040"/>
  <rect x="37.2" y="27.2" width="5.6" height="5.6" rx="1.3" transform="rotate(45 40 30)" fill="#c9ae31"/>
  <rect x="50.2" y="27.2" width="5.6" height="5.6" rx="1.3" transform="rotate(45 53 30)" fill="#93a843"/>
</svg>
