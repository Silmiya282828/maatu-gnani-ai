<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ride chat</title>
  <link rel="stylesheet" href="/phone.css">
</head>
<body>
  <div class="app">
    <!-- Laid out like the chat screen of an Indian ride app, so judges see
         where this service would live. The close and call icons are just
         set dressing. -->
    <header class="top">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
      </span>
      <div class="who">
        <div class="name" id="peerName">…</div>
        <div class="meta" id="peerMeta">…</div>
      </div>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M5 3.5h3.2l1.6 4.3-2.2 1.4a11 11 0 0 0 5.2 5.2l1.4-2.2 4.3 1.6V17a2 2 0 0 1-2 2A15 15 0 0 1 3 5.5a2 2 0 0 1 2-2Z"/></svg>
      </span>
    </header>

    <div class="strip">
      <span class="banner" id="banner">Connecting…</span>
      <label class="lang">
        <span>I speak</span>
        <select id="lang" aria-label="Your language"></select>
      </label>
    </div>

    <main class="chat" id="chat" aria-live="polite">
      <p class="empty" id="empty">Hold the mic and speak in your language,<br>or tap a quick chat. They'll hear it in theirs.</p>
    </main>

    <section class="quick" id="quick">
      <button class="quick-head" id="quickToggle" type="button" aria-expanded="true" aria-controls="quickList">
        <span class="quick-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
        </span>
        <span>Quick chat</span>
        <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m6 15 6-6 6 6"/></svg>
      </button>
      <ul class="quick-list" id="quickList"></ul>
    </section>

    <footer class="composer" id="composer">
      <form class="field" id="textForm">
        <input id="text" type="text" autocomplete="off" maxlength="500" aria-label="Message">
        <span class="rec-hint" id="talkLabel" aria-live="polite"></span>
        <button class="attach" id="attach" type="button" title="Send a recorded audio file" aria-label="Send a recorded audio file">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 11.5 12.6 20a5.3 5.3 0 0 1-7.5-7.5l8.4-8.4a3.5 3.5 0 0 1 5 5l-8.4 8.4a1.8 1.8 0 0 1-2.5-2.5l7.8-7.8"/></svg>
        </button>
      </form>
      <!-- Empty box: hold to record. Text typed: tap to send. -->
      <button class="talk" id="talk" type="button" aria-label="Hold to record a voice message">
        <svg class="mic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.6a6 6 0 0 0 5-5.9Z"/></svg>
        <svg class="send" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
      </button>
      <input type="file" id="file" accept="audio/*" hidden>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/phone.js"></script>
</body>
</html>
